<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SalesAll MVNO 프로젝트 관리</title>
<script>try{var t=localStorage.getItem("salesall-theme");if(t)document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='9' fill='%234f54e0'/><path d='M10 16.5l4 4 8-9' stroke='white' stroke-width='2.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>">
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 16 16" fill="none" stroke="rgba(255,255,255,.95)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="2.5" width="10" height="11.5" rx="1.6"/><path d="M6 2.5h4v1.6H6z" fill="rgba(255,255,255,.95)"/><path d="M5.6 8.6l1.6 1.6 3.2-3.4"/></svg>
    </div>
    <div class="title">
      <h1 id="hTitle">SalesAll MVNO</h1>
      <p id="hSub"></p>
    </div>
    <div class="spacer"></div>
    <button class="btn icon" id="themeBtn" title="라이트/다크 전환" aria-label="테마 전환">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>
    </button>
    <button class="btn primary" id="addBtn" hidden>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>
      <span class="hide-sm" id="addLbl">등록</span>
    </button>
  </header>
  <div class="tabs-wrap"><nav class="tabs" id="tabs" role="tablist" aria-label="메뉴"></nav></div>
  <div class="subnav" id="subnav"></div>
  <div class="meta" id="meta"></div>
  <main id="main"></main>
  <footer>정적 콘텐츠(회의록·가이드·용어집): repo public/data/content.json · 운영 데이터(할 일·질의·결정·이슈·요구사항·체크리스트·코멘트): Cloudflare D1</footer>
</div>
<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
